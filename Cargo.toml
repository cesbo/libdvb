[package]
name = "libdvb"
version = "0.9.1"
description = "Interface for DVB-API v5 devices in Linux"
authors = ["Cesbo Developers Team <info@cesbo.com>"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/libdvb"
repository = "https://github.com/cesbo/libdvb"
keywords = ["dvb", "ts"]
categories = ["api-bindings", "hardware-support"]
edition = "2024"

[dependencies]
bitflags = "2"
libmpegts = "0.3.8"
nix = { version = "0.31", features = ["ioctl"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "macros"], optional = true }

[[example]]
name = "camenu"
# the example carries unit tests for its input validation
test = true

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
# the camenu example waits on the CI and the terminal with poll(2), hides the
# input of a blind PIN enquiry and leaves the dialogue on a signal
nix = { version = "0.31", features = ["fs", "poll", "signal", "term"] }
# decodes the EN 300 468 annex A strings of the CAM menu
textcode = "0.3"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "test-util"] }

[package.metadata.docs.rs]
all-features = true
